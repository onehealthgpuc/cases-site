<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | OneHealth Cases</title>
  <link rel="stylesheet" href="light-theme.css">
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Arial,sans-serif; background:#f5f5f5; }
    main { width:min(380px,calc(100% - 40px)); background:#fff; padding:32px; border-radius:12px; box-shadow:0 4px 18px #0002; }
    img { display:block; width:min(280px,100%); margin:0 auto 24px; }
    label { display:block; margin:14px 0 6px; font-weight:bold; }
    input,button { width:100%; box-sizing:border-box; padding:12px; border-radius:6px; font-size:16px; }
    input { border:1px solid #bbb; }
    button { margin-top:20px; border:0; background:#f06a22; color:white; font-weight:bold; cursor:pointer; }
    button:disabled { opacity:.65; cursor:wait; }
    #forgotBtn { margin-top:10px; background:transparent; color:#b84d16; }
    #message { min-height:20px; margin-top:14px; color:#b00020; text-align:center; }
  </style>
  <link rel="stylesheet" href="design-system.css?v=5">
</head>
<body class="login-page">
<main>
  <img src="onehealth-logo.png" alt="OneHealth">
  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="submitBtn" type="submit">Sign in</button>
    <button id="forgotBtn" type="button">Forgot password?</button>
    <div id="message" role="alert"></div>
  </form>
</main>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-auth.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const button = document.getElementById('submitBtn');
  const message = document.getElementById('message');
  const params = new URLSearchParams(location.search);
  const requested = params.get('returnTo') || 'index.html';
  const returnTo = /^[a-zA-Z0-9_-]+\.html(?:\?[^#]*)?$/.test(requested) ? requested : 'index.html';

  getAccess().then(access => { if (access) location.replace(returnTo); });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    button.disabled = true;
    message.textContent = '';
    try {
      await firebase.auth().signInWithEmailAndPassword(
        document.getElementById('email').value.trim(),
        document.getElementById('password').value
      );
      const access = await getAccess();
      if (!access) {
        await firebase.auth().signOut();
        throw new Error('Your account has not been assigned access. Contact an administrator.');
      }
      location.replace(returnTo);
    } catch (error) {
      message.textContent = error.code ? 'Sign-in failed. Check your email and password.' : error.message;
      button.disabled = false;
    }
  });

  document.getElementById('forgotBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    if (!email) {
      message.textContent = 'Enter your email address first.';
      document.getElementById('email').focus();
      return;
    }
    try {
      await firebase.auth().sendPasswordResetEmail(email);
      message.style.color = '#176b2c';
      message.textContent = 'Password reset email sent. Check your inbox and junk folder.';
    } catch (error) {
      message.style.color = '#b00020';
      message.textContent = 'Unable to send the reset email. Check the address or contact an administrator.';
    }
  });
</script>
</body>
</html>
