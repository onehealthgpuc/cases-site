<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Medical Case</title>
<link rel="stylesheet" href="light-theme.css">
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #333;
    padding: 20px;
  }
  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 15px;
  }
  #logo {
    height: 50px;
    margin-bottom: 8px;
  }
  #controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
  }
  #homeBtn {
    padding: 5px 12px;
    background: orange;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
  }
  h1 {
    text-align: center;
    margin-bottom: 15px;
    color: black;
  }
  #caseInfo {
    white-space: pre-wrap;
    font-size: 16px;
    line-height: 1.5;
    min-height: 80px;
    margin-top: 15px;
    border: 1px solid #f5f5f5;
    padding: 12px;
    border-radius: 5px;
    background: #f5f5f5;
  }

   #caseInfo img {
  display: block;
  max-width: 100%;
  border: 1px solid #ccc;
  border-radius: 8px;
  margin: 10px 0;
  cursor: zoom-in;
}

  #filesContainer {
    display: flex;
    overflow-x: auto;
    gap: 10px;
    padding: 5px 0;
    margin-bottom: 15px;
  }
  #filesContainer img, #filesContainer iframe {
    max-height: 250px;
    max-width: 250px;
    border-radius: 8px;
    border: 1px solid #ccc;
    flex-shrink: 0;
  }
  .file-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
  }
  .file-link {
    display: block;
    color: orange;
    text-decoration: none;
    margin-top: 5px;
    font-weight: bold;
  }
  #formattingBtns {
    display: flex;
    gap: 5px;
    margin-top: 10px;
  }
  #formattingBtns button {
    padding: 5px 10px;
    background: white;
    color: black;
    border: 1px solid orange;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    min-width: 60px;
  }
  #saveChangesBtn {
    margin-top: 10px;
    padding: 6px 12px;
    background: orange;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    display: none;
  }
  #controls .secondary-btn, #exitPresentation {
    padding: 5px 12px;
    background: #fff !important;
    color: #000 !important;
    border: 1px solid orange;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
  }
  #caseMeta { display:flex; flex-wrap:wrap; justify-content:center; gap:7px; margin-bottom:16px; }
  .meta-chip { background:#e9e9e9; color:#111; padding:4px 9px; border-radius:14px; font-size:12px; }
  #auditInfo { margin-top:24px; color:#666; font-size:12px; text-align:center; }
  #statusControl { display:none; padding:5px; border-radius:5px; }
  body.presentation { font-size:125%; max-width:1200px; margin:0 auto !important; background:#fff; }
  body.presentation header, body.presentation #formattingBtns, body.presentation #saveChangesBtn, body.presentation #auditInfo { display:none !important; }
  body.presentation #caseInfo { font-size:1.2em; line-height:1.7; }
  #exitPresentation { display:none; position:fixed; right:15px; top:15px; z-index:20; }
  body.presentation #exitPresentation { display:block; }
</style>
<style>
  #imgModal:hover #buttonsOverlay {
    opacity: 1;
  }
  #buttonsOverlay {
    opacity: 0;
    transition: opacity 0.3s;
  }
</style>

<link rel="stylesheet" href="design-system.css?v=5">
<link rel="stylesheet" href="case-layout.css?v=6">
<link rel="stylesheet" href="ui-feedback.css">
<script src="ui-dialogs.js"></script>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
</head>
<body>

<header>
  <img id="logo" src="onehealth-logo.png" alt="OneHealth Logo">
  <div id="controls">
    <span id="userStatus"></span>
    <button id="homeBtn" onclick="window.location.href='index.html'">Home</button>
    <button class="secondary-btn" onclick="togglePresentation()">Present</button>
    <button id="editCaseBtn" class="secondary-btn" hidden>Edit case</button>
    <button class="secondary-btn" onclick="signOut()">Sign out</button>
  </div>
</header>

<h1 id="caseTitle">Loading...</h1>
<div id="caseMeta"></div>
<button id="exitPresentation" onclick="togglePresentation()">Exit presentation</button>

<div class="case-layout">
<div id="filesContainer" role="region" aria-label="Case photos and PDFs" tabindex="0"></div>

<section class="case-notes" aria-label="Clinical notes">
<div id="caseInfo" contenteditable="false"></div>

</section>
</div>
<div id="auditInfo"></div>
<!-- Attachment viewer -->
<div id="imgModal" role="dialog" aria-modal="true" aria-label="Attachment viewer" style="display:none">
  <div id="buttonsOverlay">
    <button id="drawingModeBtn" onclick="toggleDrawingMode()" aria-label="Toggle drawing" aria-pressed="false">Draw</button>
    <button onclick="clearDrawing()" aria-label="Clear drawing">Clear</button>
    <button onclick="zoomOut()" aria-label="Zoom out">−</button>
    <button onclick="resetZoom()" aria-label="Fit whole page">Fit page</button>
    <button onclick="zoomIn()" aria-label="Zoom in">＋</button>
    <label class="contrast-control" for="contrastSlider">Contrast
      <input id="contrastSlider" type="range" min="50" max="250" step="10" value="100" oninput="updateContrast(this.value)" />
      <output id="contrastValue" for="contrastSlider">100%</output>
    </label>
    <button onclick="updateContrast(100)" aria-label="Reset contrast">Reset contrast</button>
    <button onclick="closeViewer()" aria-label="Close viewer">✕</button>
  </div>
  <div id="viewerStage">
    <div id="zoomWrapper">
      <img id="imgModalContent" alt="" />
      <canvas id="drawCanvas" aria-label="Drawing overlay"></canvas>
    </div>
  </div>
  <div id="viewerNavigation">
    <button id="previousPage" onclick="showPrevImage()" aria-label="Previous page">‹</button>
    <span id="viewerStatus" role="status" aria-live="polite"></span>
    <button id="nextPage" onclick="showNextImage()" aria-label="Next page">›</button>
    <a id="viewerOriginal" target="_blank" rel="noopener noreferrer" hidden>Open original PDF</a>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="firebase-auth.js"></script>
<script src="publication-date.js"></script>
<script src="case-formatting.js"></script>

<script>
window.onload = async () => {
  const access = await requireAccess();
  window.currentAccess = access;
  document.getElementById('userStatus').textContent = `${access.user.email} (${access.role})`;
  const db = firebase.firestore();



  const urlParams = new URLSearchParams(window.location.search);
  const caseId = urlParams.get('caseId');
  if (!caseId) { await appAlert('No case selected'); return; }
  if (access.role === 'admin') {
    const editUrl = `newcase.html?caseId=${encodeURIComponent(caseId)}`;
    if (urlParams.get('edit') === '1') { window.location.replace(editUrl); return; }
    const editButton = document.getElementById('editCaseBtn');
    editButton.hidden = false;
    editButton.onclick = () => { window.location.href = editUrl; };
  }

  try {
    const doc = await db.collection('MedicalCases').doc(caseId).get();
    if (!doc.exists) { await appAlert('Case not found'); return; }

    const data = doc.data();
    document.getElementById('caseTitle').textContent = data.title;

    const meta = document.getElementById('caseMeta');
    const publicationDate = data.publishedAt || data.timestamp;
    const publicationLabel = publicationDate?.toDate ? `Published ${formatPublicationDate(publicationDate.toDate())}` : '';
    [...(data.tags || []), data.difficulty, data.durationMinutes ? `${data.durationMinutes} min` : '', publicationLabel].filter(Boolean).forEach(value => {
      const chip=document.createElement('span'); chip.className='meta-chip'; chip.textContent=value; meta.appendChild(chip);
    });
    const created = data.createdBy?.email ? `Created by ${data.createdBy.email}` : '';
    const updated = data.updatedBy?.email ? `Last edited by ${data.updatedBy.email}` : '';
    const updatedDate = data.updatedAt?.toDate ? data.updatedAt.toDate().toLocaleString() : '';
    document.getElementById('auditInfo').textContent = [created, updated, updatedDate].filter(Boolean).join(' · ');

    const filesContainer = document.getElementById('filesContainer');
    filesContainer.innerHTML = '';

    if (data.files && data.files.length) {
      data.files.forEach(file => {
        if (file.type === 'image') {
          const img = document.createElement('img');
          img.src = file.url;
          img.alt = file.name || 'Case photo';
          img.style.maxHeight = '250px';
          img.style.borderRadius = '8px';
          img.style.border = '1px solid #ccc';
          filesContainer.appendChild(img);
        } else if (file.type === 'pdf') {
          const wrapper = document.createElement('div');
          wrapper.className = 'file-wrapper pdf-file';
          wrapper.style.display = 'flex';
          wrapper.style.flexDirection = 'column';
          wrapper.style.alignItems = 'center';
          wrapper.style.gap = '5px';

          // Show a first-page image that can use the standard zoom viewer.
          let previewUrl = file.previewUrl || '';
          if (!previewUrl) {
            try {
              const isCloudinaryImage = /\/image\/upload\/.*f_jpg/i.test(file.url);
              if (isCloudinaryImage) previewUrl = file.url;
              else {
                const pdfPublicId = file.url.split('/').pop().replace(/\.pdf(?:\?.*)?$/i,'');
                previewUrl = `https://res.cloudinary.com/dsc0hziur/image/upload/f_jpg,pg_1,q_auto,w_800/${pdfPublicId}.pdf`;
              }
            } catch { previewUrl = ''; }
          }

          let previewImage;
          if (previewUrl) {
            const img = document.createElement('img');
            img.src = previewUrl;
            img.alt = `First page preview of ${file.name || 'PDF'}`;
            img.title = 'Click to view PDF';
            img.dataset.pdfUrl = file.url;
            img.style.maxHeight = '250px';
            img.style.borderRadius = '8px';
            img.style.border = '1px solid #ccc';
            img.style.cursor = 'zoom-in';
            wrapper.appendChild(img);
            previewImage = img;
          }

          if (previewImage) {
            const zoomBtn = document.createElement('button');
            zoomBtn.textContent = 'View PDF';
            zoomBtn.className = 'secondary-btn';
            zoomBtn.onclick = () => previewImage.click();
            wrapper.appendChild(zoomBtn);
          }

          const openBtn = document.createElement('button');
          openBtn.textContent = 'Open PDF';
          openBtn.className = 'secondary-btn';
          openBtn.onclick = () => openPdfViewer(file.url, file.name || 'PDF');
          wrapper.appendChild(openBtn);

          filesContainer.appendChild(wrapper);
        }
      });
    }

    const info = linkify(data.info || '');
    document.getElementById('caseInfo').innerHTML = data.status === 'draft' ? info : formatClinicalHeadings(info);

  } catch (err) {
    console.error('Error loading case:', err);
    await appAlert('Failed to load case. Check console.');
  }
};

// Convert URLs in text to clickable links
function linkify(html) {
  // Create a temporary container
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = html;

  function linkifyNode(node) {
    if (node.nodeType === Node.TEXT_NODE) {
      const urlPattern = /(\b(https?:\/\/|www\.)[^\s<]+)/gi;
      const frag = document.createDocumentFragment();
      let lastIndex = 0;
      let match;
      while ((match = urlPattern.exec(node.textContent)) !== null) {
        // Add text before the URL
        if (match.index > lastIndex) {
          frag.appendChild(document.createTextNode(node.textContent.slice(lastIndex, match.index)));
        }

        let hyperlink = match[0];
        if (!hyperlink.match(/^https?:\/\//)) {
          hyperlink = 'http://' + hyperlink;
        }

        const a = document.createElement('a');
        a.href = hyperlink;
        a.target = '_blank';
        a.style.color = 'orange';
        a.style.textDecoration = 'underline';
        a.textContent = match[0];
        frag.appendChild(a);

        lastIndex = match.index + match[0].length;
      }

      // Add remaining text
      if (lastIndex < node.textContent.length) {
        frag.appendChild(document.createTextNode(node.textContent.slice(lastIndex)));
      }

      node.replaceWith(frag);
    } else if (node.nodeType === Node.ELEMENT_NODE) {
      // Recurse for child nodes
      Array.from(node.childNodes).forEach(linkifyNode);
    }
  }

  Array.from(tempDiv.childNodes).forEach(linkifyNode);

  return tempDiv.innerHTML;
}



</script>
<script src="media-viewer.js?v=6"></script>
<script>
function setPresentationMode(presenting) {
  document.body.classList.toggle('presentation', presenting);

  ['caseTitle', 'caseInfo'].forEach(id => {
    const element = document.getElementById(id);
    element.contentEditable = 'false';
    if (presenting) element.blur();
  });


}

function togglePresentation() {
  const presenting = !document.body.classList.contains('presentation');
  setPresentationMode(presenting);
  if (presenting) document.documentElement.requestFullscreen?.().catch(()=>{});
  else if (document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
}

// Escape exits browser fullscreen; restore the normal case view and permissions.
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && document.body.classList.contains('presentation')) {
    setPresentationMode(false);
  }
});


</script>
</body>
</html>
