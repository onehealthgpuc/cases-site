<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Cases</title>
<link rel="stylesheet" href="light-theme.css">
<style>
    
  
  body {
    font-family: Arial;
    background: #f5f5f5;
    padding: 10px;
    text-align: center;
    position: relative;
  }

  img#logo {
    width: 450px;
    margin-bottom: 20px;
  }

  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
    margin-top: 20px;
  }

  .card {
    background: #fff;
    padding: 15px;
    border-radius: 8px;
    width: 220px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    cursor: pointer;
    position: relative;
    transition: transform 0.2s;
  }

  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.2);
  }

  .card h2 {
    font-size: 16px;
    margin: 0 0 10px 0;
    word-wrap: break-word;
  }

  .badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: red;
    color: white;
    padding: 2px 6px;
    border-radius: 50%;
    font-size: 12px;
  }

  .card-meta { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin:8px 0; }
  .meta-chip { background:#f1f1f1; color:#222; border-radius:12px; padding:3px 7px; font-size:11px; }
  .status-chip { font-size:11px; font-weight:bold; text-transform:uppercase; color:#8a4200; }
  .card-menu { position:absolute; left:8px; top:8px; z-index:2; }
  .menu-toggle { border:0; background:#fff; color:#222; font-size:20px; border-radius:50%; width:30px; height:30px; cursor:pointer; }
  .menu-panel { display:none; position:absolute; left:0; top:32px; min-width:110px; background:#fff; border:1px solid #ddd; border-radius:6px; box-shadow:0 3px 10px #0003; overflow:hidden; }
  .menu-panel.open { display:block; }
  .menu-panel button { display:block; width:100%; padding:8px 10px; border:0; background:#fff; color:#111; text-align:left; cursor:pointer; }
  .menu-panel button:hover { background:#f3f3f3; }
  .menu-panel .danger { color:#b00020; }

  /* --- Uniform controls bar --- */
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .controls input[type="text"],
  .controls button,
  #settingsIcon {
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 4px;
    border: 1px solid #e0773a;  /* dark orange */
    background: #fff;
    color: black;
    cursor: pointer;
    min-width: 80px;
    text-align: center;
  }

  #searchInput {
    min-width: 100px;
    text-align: left;

  }

  .controls button:hover,
  #settingsIcon:hover {
    background: #ffe4cc;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@2/dist/email.min.js"></script>
<script>
  (function(){ emailjs.init("SlgDGx0oPoAoDrWia"); })();
</script>
<link rel="stylesheet" href="design-system.css?v=5">
</head>
<body>

  <img id="logo" src="onehealth-logo.png" alt="OneHealth Logo">
  <div class="page-heading"><h1>Clinical case library</h1><p>Focused learning from real urgent care presentations.</p></div>

  <!-- Controls Row -->
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search...">
    <select id="tagFilter" aria-label="Filter by tag"><option value="">All tags</option></select>
    <button id="rosterBtn">Roster</button>
    <button id="newCaseBtn" onclick="window.location.href='newcase.html'">+ New Case</button>
    <button id="pingBtn" title="Send Ping">📩</button>
    <button id="settingsIcon" class="control-item">⚙️</button>
    <button id="usersBtn">Users</button>
    <span id="userStatus"></span>
    <button id="passwordBtn">Change password</button>
    <button onclick="signOut()">Sign out</button>
  </div>

  <!-- Cases container -->
  <div class="cards" id="casesContainer"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-auth.js"></script>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
window.onload = async () => {
  const access = await requireAccess();
  const isAdmin = access.role === 'admin';
  const db = firebase.firestore();

  // --- Initialize EmailJS ---
  emailjs.init("SlgDGx0oPoAoDrWia");

  const container = document.getElementById('casesContainer');
  const searchInput = document.getElementById('searchInput');
  const settingsIcon = document.getElementById('settingsIcon');
  const pingBtn = document.getElementById('pingBtn');
  const usersBtn = document.getElementById('usersBtn');
  const tagFilter = document.getElementById('tagFilter');
  const passwordBtn = document.getElementById('passwordBtn');

  let allCases = [];
  document.getElementById('userStatus').textContent = `${access.user.email} (${access.role})`;
  document.getElementById('newCaseBtn').style.display = isAdmin ? '' : 'none';
  settingsIcon.style.display = isAdmin ? '' : 'none';
  pingBtn.style.display = isAdmin ? '' : 'none';
  usersBtn.style.display = isAdmin ? '' : 'none';

  // --- Load Cases ---
  async function loadCases() {
    try {
      const query = isAdmin
        ? db.collection('MedicalCases').orderBy('timestamp','desc')
        : db.collection('MedicalCases').where('status','==','published');
      const snapshot = await query.get();
      allCases = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      if (!isAdmin) allCases.sort((a,b)=>(b.timestamp?.toMillis?.()||0)-(a.timestamp?.toMillis?.()||0));
      if (isAdmin) {
        const legacy = snapshot.docs.filter(doc => !doc.data().status);
        if (legacy.length) {
          const batch = db.batch();
          legacy.forEach(doc => batch.update(doc.ref, {status:'published'}));
          await batch.commit();
          allCases.forEach(item => { if (!item.status) item.status = 'published'; });
        }
      }
      populateTagFilter();
      renderCards(allCases);
    } catch(err) {
      console.error(err);
      container.innerHTML = '<p>Error loading cases. Check console.</p>';
    }
  }

  // --- Render Cases ---
  function renderCards(cases) {
    container.innerHTML = '';
    cases.forEach(data => {
      const caseId = data.id;
      const card = document.createElement('div');
      card.className = 'card';
      card.style.position = 'relative';

      // Click to open case
      card.onclick = (e) => {
        localStorage.setItem(caseId, 'opened');
        window.location.href = `viewcase.html?caseId=${caseId}`;
      };

      // Thumbnail
      if(data.files && data.files.length > 0) {
        const file = data.files[0];
        const img = document.createElement('img');
        img.src = file.type === 'pdf' ? 'pdf-icon.png' : file.url;
        img.alt = file.name;
        img.style.width = '20%';
        img.style.height = '50px';
        img.style.objectFit = 'cover';
        img.style.borderRadius = '5px';
        img.style.marginBottom = '8px';
        card.appendChild(img);
      }

      // Title
      const title = document.createElement('h2');
      title.textContent = data.title || 'Untitled Case';
      card.appendChild(title);

      const meta = document.createElement('div');
      meta.className = 'card-meta';
      [...(data.tags || []).slice(0,3), data.difficulty, data.durationMinutes ? `${data.durationMinutes} min` : '']
        .filter(Boolean).forEach(value => {
          const chip = document.createElement('span'); chip.className='meta-chip'; chip.textContent=value; meta.appendChild(chip);
        });
      card.appendChild(meta);
      if (isAdmin && data.status === 'draft') {
        const status = document.createElement('div'); status.className='status-chip'; status.textContent='Draft'; card.appendChild(status);
      }

      // Timestamp
      const displayDate = data.publishedAt || data.timestamp;
      if(displayDate) {
        const ts = document.createElement('div');
        ts.textContent = `Published ${displayDate.toDate().toLocaleDateString()}`;
        ts.style.fontSize = '12px';
        ts.style.color = '#555';
        ts.style.marginBottom = '6px';
        card.appendChild(ts);
      }

      // New badge
      if(data.isNew && !localStorage.getItem(caseId)) {
        const badge = document.createElement('div');
        badge.className = 'badge';
        badge.textContent = 'New';
        badge.style.background = '#ff4d4d';
        badge.style.color = '#fff';
        badge.style.padding = '2px 6px';
        badge.style.borderRadius = '4px';
        badge.style.fontSize = '10px';
        badge.style.position = 'absolute';
        badge.style.top = '5px';
        badge.style.right = '5px';
        card.appendChild(badge);
      }

      if (isAdmin) {
        const menu = document.createElement('div'); menu.className='card-menu';
        const toggle = document.createElement('button'); toggle.className='menu-toggle'; toggle.textContent='⋮'; toggle.setAttribute('aria-label',`Actions for ${data.title}`);
        const panel = document.createElement('div'); panel.className='menu-panel';
        const edit = document.createElement('button'); edit.textContent='Edit'; edit.onclick=e=>{e.stopPropagation();location.href=`viewcase.html?caseId=${caseId}&edit=1`;};
        const remove = document.createElement('button'); remove.textContent='Delete'; remove.className='danger';
        remove.onclick = async e => {
          e.stopPropagation();
          if(!confirm(`Permanently delete “${data.title || 'Untitled Case'}”?`)) return;
          try { await db.collection('MedicalCases').doc(caseId).delete(); allCases=allCases.filter(c=>c.id!==caseId); applyFilters(); }
          catch(err){ console.error(err); alert('Failed to delete case.'); }
        };
        toggle.onclick=e=>{e.stopPropagation();document.querySelectorAll('.menu-panel.open').forEach(p=>{if(p!==panel)p.classList.remove('open');});panel.classList.toggle('open');};
        panel.onclick=e=>e.stopPropagation(); panel.append(edit,remove); menu.append(toggle,panel); card.appendChild(menu);
      }

      container.appendChild(card);
    });
  }

  // --- Search ---
  searchInput.addEventListener('input', e => {
    applyFilters();
  });
  tagFilter.addEventListener('change', applyFilters);

  function applyFilters() {
    const query = searchInput.value.toLowerCase();
    const selectedTag = tagFilter.value;
    const filtered = allCases.filter(c => {
      const titleMatch = c.title?.toLowerCase().includes(query);
      const tagText = (c.tags || []).join(' ').toLowerCase();
      const tagSearchMatch = tagText.includes(query);
      const dateMatch = c.timestamp?.toDate().toLocaleString().toLowerCase().includes(query);
      const selectedTagMatch = !selectedTag || (c.tags || []).includes(selectedTag);
      return (titleMatch || tagSearchMatch || dateMatch) && selectedTagMatch;
    });
    renderCards(filtered);
  }

  function populateTagFilter() {
    const tags=[...new Set(allCases.flatMap(c=>c.tags||[]))].sort();
    tags.forEach(tag=>{const option=document.createElement('option');option.value=tag;option.textContent=tag;tagFilter.appendChild(option);});
  }

  // --- Settings icon ---
  settingsIcon.addEventListener('click', () => {
    window.open('emailrecipients.html', '_blank');
  });
  usersBtn.addEventListener('click', () => { window.open('users.html','_blank'); });
  passwordBtn.addEventListener('click', async () => {
    try {
      await firebase.auth().sendPasswordResetEmail(access.user.email);
      alert(`A secure password-change link was sent to ${access.user.email}.`);
    } catch (error) {
      console.error(error);
      alert('Unable to send the password-change email.');
    }
  });

  // --- Ping button ---
  pingBtn.addEventListener('click', async () => {
    try {
      const snapshot = await db.collection('EmailRecipients').get();
      const emails = snapshot.docs.map(doc => doc.data().email);
      if(emails.length === 0) return alert("No recipients saved!");

      // Latest case info
      const latestCase = allCases[0];
      const caseTitle = latestCase?.title || "Untitled Case";
      const caseLink = "https://onehealthgpuc.github.io/cases-site/";


      for(const email of emails) {
        try {
          await emailjs.send("service_zsj96dz", "template_p9p8gyc", {
            recipient_email: email,
            message: "A new medical case has been uploaded.",
            case_title: caseTitle,
            case_link: caseLink
          });
          console.log(`Email sent to ${email}`);
        } catch(err) {
          console.error(`Failed to send email to ${email}:`, err);
        }
      }

      alert("Ping email sent to all recipients!");
    } catch(err) {
      console.error("Failed to send ping:", err);
      alert("Failed to send ping. Check console for details.");
    }
  });

  // --- Initial load ---
  loadCases();
};
document.getElementById('rosterBtn').addEventListener('click', () => {
  window.location.href = 'https://onehealthgpuc.github.io/OHRoster/';
});

</script>



</body>
</html>
